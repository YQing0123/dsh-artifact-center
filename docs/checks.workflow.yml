name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - name: Verify packed candidate against Git HEAD
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .cache
          npm pack --pack-destination .cache
          npm run release:check
      - name: Keep local candidate evidence
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-${{ github.sha }}
          path: |
            .cache/dsh-artifact-center-*.tgz
            .cache/release-receipt-*.json
          retention-days: 14
